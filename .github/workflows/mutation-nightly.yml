name: Mutation Nightly (domain 85%, manual only)

# R6 follow-up: the main CI mutation gate stays at 80% for speed; this
# workflow enforces the stricter 85% domain-mutation target from the
# `pitest-domain` profile (root pom).
#
# SCHEDULE DISABLED (2026-10-19): the weekly cron trigger is removed, so
# this job no longer runs unattended and no longer consumes CI minutes.
# The file is kept — not deleted — so the 85% domain gate stays
# reproducible on demand via "Run workflow", and so the workflow stays
# visible in the repository's CI inventory. To restore the weekly
# cadence, re-add:
#
#   schedule:
#     - cron: '0 2 * * 1' # Monday 02:00 UTC
#
# What is lost: only the stricter domain-only mutation number stopped
# being enforced automatically. The main CI gate (ci.yml — 80% mutation,
# 85% aggregate coverage) is untouched and still runs on every push, and
# mutation-pr.yml still reports the changed modules' survivors on every
# pull request.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-domain:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bank_db
          POSTGRES_USER: bank_user
          POSTGRES_PASSWORD: bank_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Same two-phase sequence as the root pom documents: reactor JARs
    # (including the shared test JAR) must be installed before PIT's
    # separate invocation can resolve them.
    - name: Resolve CI JWT secret (HIGH-2, no committed fallback)
      run: |
        if [ -n "${{ secrets.JWT_SECRET }}" ]; then
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> "$GITHUB_ENV"
        else
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
        fi

    - name: Install reactor JARs
      run: mvn -B -ntp clean install -DskipTests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: ${{ env.JWT_SECRET }}

    - name: Domain mutation coverage (85% gate)
      # NOTE: -DtargetClasses is intentional. Every module pom pins its own
      # broad targetClasses (e.g. infrastructure: com.bank.app.infrastructure.*),
      # which shadows the pitest-domain profile's domain filter in
      # pluginManagement. Without this flag the nightly gates every module's
      # adapters at 85% instead of only domain code. -DfailWhenNoMutations
      # lets domain-free modules (infrastructure, app) pass with 0 mutants.
      run: mvn -B -ntp pitest:mutationCoverage -Ppitest-domain -DtargetClasses='com.bank.app.*.domain.*,com.bank.app.common.domain.*' -DfailWhenNoMutations=false -Dpitest.skip=false -T 4
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload domain PIT report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pit-domain-nightly
        path: '**/target/pit-reports/'
