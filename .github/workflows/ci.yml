name: Java CI/CD with Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Reject newly vulnerable dependencies
      uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      with:
        fail-on-severity: high

  codeql:
    # SAST gate: the OSV/dependency-review jobs cover vulnerable libraries,
    # but only CodeQL looks for injection, auth-bypass and crypto misuse in
    # this repository's own Java. Findings are uploaded to code scanning;
    # the build step is explicit (instead of autobuild) so the analysed
    # classpath is the same multi-module Maven build used everywhere else.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: java-kotlin
        queries: security-extended
    - name: Build for CodeQL
      run: mvn -B -ntp -DskipTests compile
    - name: Analyze
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:java-kotlin"

  secret-scan:
    # I-03: working-tree secret scan (rules in .gitleaks.toml). Allowlisted
    # values are documented non-secret placeholders and test-only fixtures
    # (see .gitleaks.toml + docs/decisions/secret-management.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0
    - name: Gitleaks scan
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # D21: least privilege — checkout + artifact upload need only read.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bank_db
          POSTGRES_USER: bank_user
          POSTGRES_PASSWORD: bank_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Image-pin encoding self-test (R-O08)
      # Windows PowerShell 5.1 reads/writes BOM-less files with the ANSI code
      # page; the pin script must prove it preserves UTF-8 (em dash/Turkish)
      # and CRLF. GitHub's Ubuntu runner ships pwsh, so run the regression
      # vector here rather than only on a developer laptop.
      shell: pwsh
      run: ./scripts/pin-image-digest.ps1 -SelfTest

    - name: Static repository contracts (K9/D7, O-1/O-3, O-8, I-08)
      # Single source of truth shared with scripts/test-all.*: mutable image
      # tags, migration-soak presence, migration content contract, supply-chain
      # self-contracts, deployment-manifest presence and tool-only sources.
      run: python3 scripts/check_ci_contracts.py

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Resolve CI JWT secret (HIGH-2, no committed fallback)
      # Never embed a secret literal in the workflow: prefer the repo secret,
      # otherwise mint a fresh ephemeral 256-bit key for this run only.
      run: |
        if [ -n "${{ secrets.JWT_SECRET }}" ]; then
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> "$GITHUB_ENV"
        else
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
        fi

    # D21: no explicit actions/cache for ~/.m2 — setup-java's `cache: maven`
    # above already handles it; the duplicate step only doubled cache writes.
    - name: Unit & Integration Tests (with coverage)
      # PIT runs in a separate parallel Maven invocation and needs reactor JARs
      # (including common's test JAR) installed in the local repository.
      run: mvn -B -ntp clean install
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: ${{ env.JWT_SECRET }}

    - name: Generate aggregate CycloneDX SBOM
      # `makeAggregateBom` aggregates the CURRENT project's dependency tree.
      # Run at the ROOT it saw only the root pom's own test-scoped
      # dependencies (the reactor modules are declared as <modules>, not
      # <dependencies>), so the uploaded BOM contained no application
      # dependency. The app module depends on every other module, so the
      # aggregate is produced there.
      run: |
        mvn -B -ntp -pl app org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
        test -s app/target/bom.json

    - name: Upload CycloneDX SBOM
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: cyclonedx-sbom
        path: app/target/bom.json
        if-no-files-found: error

    - name: Dependency review (OSV gate)
      # Local equivalent of the PR advisory gate (docs/decisions/dependency-review.md):
      # fails on HIGH/CRITICAL modulo scripts/dependency_allowlist.json.
      run: python3 scripts/dependency_review.py

    - name: Check aggregate coverage for every module
      run: python3 scripts/check_aggregate_coverage.py app/target/site/jacoco-aggregate/jacoco.xml

    - name: Check Kubernetes manifest against the prod contract
      # The manifest is the only description of a deployment, and the app
      # fails fast on several prod preconditions. A manifest that omits one
      # does not fail the build — it fails the deployment as a
      # CrashLoopBackOff.
      run: python3 scripts/check_k8s_manifest_contract.py

    - name: Check load-test acceptance criteria
      run: python3 -m unittest load_tests.test_runner -v

    - name: Check load acceptance thresholds are pinned
      run: python3 scripts/check_load_acceptance.py

    - name: Check restore-drill contract (script, template, ledger gauge)
      run: python3 scripts/check_restore_drill.py

    - name: Migration chain contract (T-1/O-3 upgrade-path guard)
      # Static half of the upgrade-path story: a broken Flyway chain (gap,
      # duplicate, empty file) fails closed at deploy time — catch it here.
      # The dynamic half (seeded-volume soak) stays manual per release
      # (scripts/migration_soak.sh) because it needs a staging dump.
      run: python3 scripts/check_migration_chain.py

    - name: Python contract checks (secret pin, test DI)
      # Static presence/supply-chain/migration-content guards run in the
      # "Static repository contracts" step above; this step owns the executable
      # Python guards and their self-tests.
      run: |
        python3 scripts/check_compose_jwt_default.py
        python3 scripts/check_test_injection.py
        python3 scripts/check_error_keys.py
        python3 scripts/check_migration_timeouts.py
        python3 scripts/check_code_health.py
        python3 scripts/check_migration_timeouts.py --self-test
        python3 scripts/check_code_health.py --self-test

    - name: Live rate-limit smoke (real app + runner)
      # Boots the packaged jar against the CI postgres/redis services and runs
      # the deterministic rate-limit profile (15 registrations -> 429, then
      # success after the window). Workload/capacity modes stay manual (see
      # load_tests/README.md): they need raised limits and a long runtime.
      run: |
        python3 -m pip install -r load_tests/requirements.txt
        export SPRING_PROFILES_ACTIVE=dev
        export DB_HOST=localhost DB_PORT=5432 DB_USERNAME=bank_user DB_PASSWORD=bank_password
        export REDIS_HOST=localhost REDIS_PORT=6379
        export JWT_SECRET="${JWT_SECRET:?JWT_SECRET must be resolved by the earlier step}"
        java -jar app/target/app-*.jar > app-load-smoke.log 2>&1 &
        echo $! > app-load.pid
        trap 'kill "$(cat app-load.pid)" 2>/dev/null || true' EXIT
        for i in $(seq 1 36); do
          if python3 ops/health_smoke.py http://localhost:8080 >/dev/null 2>&1; then
            break
          fi
          sleep 5
        done
        python3 ops/health_smoke.py http://localhost:8080
        # K1/D1 in the profile that CI actually boots (dev). Only
        # application-prod.yml whitelists /actuator/prometheus, so a secured
        # endpoint is correct here -- but a 404 is not, and that is exactly the
        # silent failure mode: prometheus dropped from
        # management.endpoints.web.exposure.include kills the alarm line in every
        # environment while every other check stays green.
        python3 ops/health_smoke.py http://localhost:8080 --require-metrics --allow-metrics-secured
        python3 load_tests/runner.py --mode rate-limit
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload load-smoke app log
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: load-smoke-app-log
        path: app-load-smoke.log
        if-no-files-found: warn

    - name: Check deployment smoke-check contracts
      run: python3 -m unittest ops.test_health_smoke -v

    - name: Check browser API contracts and idempotency behavior
      run: |
        node --check app/src/main/resources/static/storage.js
        node --check app/src/main/resources/static/i18n.js
        node --check app/src/main/resources/static/idempotency.js
        node --check app/src/main/resources/static/accounts.js
        node --check app/src/main/resources/static/transfers.js
        node --check app/src/main/resources/static/http.js
        node --check app/src/main/resources/static/reports.js
        node --check app/src/main/resources/static/detail.js
        node --check app/src/main/resources/static/format.js
        node --check app/src/main/resources/static/auth.js
        node --check app/src/main/resources/static/app.js
        # node:test runner (TAP + non-zero exit on failure); new *.test.js
        # files under app/src/test/js/ are picked up without editing CI.
        # Quoted glob (not a bare directory): node expands it internally on
        # every OS; a bare dir path is treated as a module and fails.
        node --test "app/src/test/js/*.test.js"

    - name: Frontend XSS guard (H-2)
      run: |
        python3 scripts/check_frontend_xss.py
        python3 scripts/check_frontend_xss.py --self-test

    - name: Frontend lint (ESLint, M-1 slice)
      run: |
        npm ci
        npm run lint

    - name: Frontend audit (npm audit, high+, advisory)
      # Advisory on purpose: the shipped UI is dependency-free vanilla JS —
      # npm covers a single devDependency (eslint), so a blocking gate would
      # let dev-tool noise veto prod builds. Findings are reported for triage;
      # blocking supply-chain gates stay in dependency-review + OSV review.
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Architecture Tests
      # Wildcard (not an explicit class list): a new *ArchitectureTest must
      # run in CI without editing this file. Verified pattern covers all
      # architecture rules including future additions.
      #
      # No `-am`: the earlier `clean install` already built and installed
      # every module, so the reactor was rebuilt from scratch a second time
      # for no new coverage. `-pl app` alone resolves the sibling modules
      # from the local repository.
      run: mvn test -pl app -Dtest="*ArchitectureTest,PersistenceScanPackagesTest" -Dsurefire.failIfNoSpecifiedTests=false -q

    - name: Dependency Analysis (advisory — starter aggregation causes false positives)
      run: mvn dependency:analyze -q
      continue-on-error: true

    - name: Cache PIT History
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: '**/target/pit-history.txt'
        key: ${{ runner.os }}-pit-${{ hashFiles('**/*.java') }}
        restore-keys: ${{ runner.os }}-pit-

    - name: Mutation Tests (PIT)
      run: mvn pitest:mutationCoverage -Dpitest.skip=false -T 4 -q
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload JaCoCo Coverage Report
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: jacoco-reports
        path: |
          **/target/site/jacoco/
          **/target/site/jacoco-aggregate/

    - name: Upload PIT Mutation Report
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: pit-reports
        path: '**/target/pit-reports/'

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: test-results
        path: '**/target/surefire-reports/'

    - name: Upload Failsafe Integration Test Results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: failsafe-reports
        path: '**/target/failsafe-reports/'

    - name: Build image (Dockerfile regression guard)
      # O-1: the release publishes an image, so CI must prove the Dockerfile
      # still builds on every PR — otherwise a broken Dockerfile reaches the
      # registry unnoticed. push:false keeps the result local; nothing is
      # published.
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        tags: bank-app:ci

  migration-soak:
    # O-1/DB-1: presence checks cannot catch a migration that only fails on a
    # populated table. Migrate a fresh DB to the second-latest version, seed a
    # production-shaped transfers table, then apply the newest migration.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bank_db
          POSTGRES_USER: bank_user
          POSTGRES_PASSWORD: bank_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Install Flyway CLI
      run: |
        VERSION=$(sed -n 's:.*<flyway.version>\(.*\)</flyway.version>.*:\1:p' pom.xml | head -1)
        if [ -z "$VERSION" ]; then
          echo "::error::flyway.version missing from pom.xml"
          exit 1
        fi
        curl -fsSL \
          "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${VERSION}/flyway-commandline-${VERSION}-linux-x64.tar.gz" \
          -o "$RUNNER_TEMP/flyway.tar.gz"
        tar -xzf "$RUNNER_TEMP/flyway.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/flyway-${VERSION}" >> "$GITHUB_PATH"

    - name: Select soak baseline (second-latest migration)
      id: baseline
      run: |
        mapfile -t MIGRATIONS < <(
          find migrations/src/main/resources/db/migration -maxdepth 1 -name 'V*__*.sql' -printf '%f\n' | sort -V
        )
        if [ "${#MIGRATIONS[@]}" -lt 2 ]; then
          echo "::error::need at least two migrations to soak the latest"
          exit 1
        fi
        BASELINE="${MIGRATIONS[-2]}"
        VERSION="${BASELINE#V}"
        VERSION="${VERSION%%__*}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Soak baseline: $BASELINE (target V$VERSION)"

    - name: Run seeded migration soak
      env:
        PSQL_URL: postgresql://bank_user:bank_password@localhost:5432/bank_db
        FLYWAY_URL: jdbc:postgresql://localhost:5432/bank_db?options=-c%20statement_timeout%3D10min%20-c%20idle_in_transaction_session_timeout%3D0
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        PGTZ: UTC
        SEED_ROWS: '100000'
        BASELINE_TARGET: ${{ steps.baseline.outputs.version }}
      run: bash scripts/migration_soak.sh

    - name: Upload migration soak log
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: migration-soak-log
        path: migration-soak.log
        if-no-files-found: warn
