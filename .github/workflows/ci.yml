name: Java CI/CD with Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Reject newly vulnerable dependencies
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high

  secret-scan:
    # I-03: working-tree secret scan (rules in .gitleaks.toml). The two
    # allowlisted values are documented test-only fallbacks that can never
    # authenticate in prod (see .gitleaks.toml + docs/decisions/secret-management.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Gitleaks scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # D21: least privilege — checkout + artifact upload need only read.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bank_db
          POSTGRES_USER: bank_user
          POSTGRES_PASSWORD: bank_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5

    - name: Guard against mutable image tags (K9/D7)
      # The release workflow pins k8s/bank-app.yaml to a digest; the default
      # must stay a versioned tag so an unpinned apply can never roll :latest.
      # Match `image:` lines only: the manifest documents the forbidden value
      # in its own comments, and a bare substring grep false-positives on them.
      run: |
        if grep -Eq "^[[:space:]]*image:[[:space:]]+bank-app:latest([[:space:]#]|$)" k8s/bank-app.yaml; then
          echo "::error::k8s/bank-app.yaml must not reference bank-app:latest (K9/D7)"
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # D21: no explicit actions/cache for ~/.m2 — setup-java's `cache: maven`
    # above already handles it; the duplicate step only doubled cache writes.
    - name: Unit & Integration Tests (with coverage)
      # PIT runs in a separate parallel Maven invocation and needs reactor JARs
      # (including common's test JAR) installed in the local repository.
      run: mvn -B -ntp clean install
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        # CI-only fallback: deliberately NOT the dev default (...5970). The
        # last-character difference is intentional — it keeps CI runs off the
        # publicly-known dev secret while remaining a valid 256-bit key.
        JWT_SECRET: ${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5971' }}

    - name: Generate aggregate CycloneDX SBOM
      run: |
        mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
        test -s target/bom.json

    - name: Upload CycloneDX SBOM
      uses: actions/upload-artifact@v6
      with:
        name: cyclonedx-sbom
        path: target/bom.json
        if-no-files-found: error

    - name: Dependency review (OSV gate)
      # Local equivalent of the PR advisory gate (docs/decisions/dependency-review.md):
      # fails on HIGH/CRITICAL modulo scripts/dependency_allowlist.json.
      run: python3 scripts/dependency_review.py

    - name: Check aggregate coverage for every module
      run: python3 scripts/check_aggregate_coverage.py app/target/site/jacoco-aggregate/jacoco.xml

    - name: Check load-test acceptance criteria
      run: python3 -m unittest load_tests.test_runner -v

    - name: Check load acceptance thresholds are pinned
      run: python3 scripts/check_load_acceptance.py

    - name: Check restore-drill contract (script, template, ledger gauge)
      run: python3 scripts/check_restore_drill.py

    - name: Migration-soak presence (O-1/DB-1 large-table guard)
      run: |
        test -f scripts/migration_soak.sh
        test -f common/src/main/resources/db/migration/V43__transfer_history_keyset_covering_indexes.sql
        test -f k8s/grafana-dashboard.json
        echo "migration-soak + keyset index + dashboard present"

    - name: Contract checks (secret pin, test DI, autoscaling, prod compose, partition scripts)
      run: |
        python3 scripts/check_compose_jwt_default.py
        python3 scripts/check_test_injection.py
        grep -q "kind: HorizontalPodAutoscaler" k8s/bank-app.yaml
        grep -q "kind: PodDisruptionBudget" k8s/bank-app.yaml
        test -f docker-compose.prod.yml
        test -f scripts/audit_partition_cutover.sql
        test -f scripts/ensure_audit_partition.sql
        test -f scripts/audit_partition_finalize.sql
        echo "contracts present"

    - name: Tool-only sources guard (I-08)
      # audit-work/ holds investigation probes and evidence JSON — no Maven
      # module may compile or reference it. It is outside every module's
      # src/ tree by construction; this fails closed if that ever changes.
      run: |
        if grep -rq "audit-work" --include="pom.xml" . 2>/dev/null; then
          echo "::error::no module pom may reference audit-work/ (tool-only sources)"
          exit 1
        fi
        refs=$(grep -rl "audit\.work\|audit-work" --include="*.java" account user transfer audit common infrastructure persistence app account-api 2>/dev/null | grep -v "/target/" || true)
        if [ -n "$refs" ]; then
          echo "::error::main sources must not reference audit-work/ probes: $refs"
          exit 1
        fi
        echo "tool-only sources guard passed"

    - name: Live rate-limit smoke (real app + runner)
      # Boots the packaged jar against the CI postgres/redis services and runs
      # the deterministic rate-limit profile (15 registrations -> 429, then
      # success after the window). Workload/capacity modes stay manual (see
      # load_tests/README.md): they need raised limits and a long runtime.
      run: |
        python3 -m pip install -r load_tests/requirements.txt
        export SPRING_PROFILES_ACTIVE=dev
        export DB_HOST=localhost DB_PORT=5432 DB_USERNAME=bank_user DB_PASSWORD=bank_password
        export REDIS_HOST=localhost REDIS_PORT=6379
        export JWT_SECRET="${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5971' }}"
        java -jar app/target/app-*.jar > app-load-smoke.log 2>&1 &
        echo $! > app-load.pid
        trap 'kill "$(cat app-load.pid)" 2>/dev/null || true' EXIT
        for i in $(seq 1 36); do
          if python3 ops/health_smoke.py http://localhost:8080 >/dev/null 2>&1; then
            break
          fi
          sleep 5
        done
        python3 ops/health_smoke.py http://localhost:8080
        # K1/D1 in the profile that CI actually boots (dev). Only
        # application-prod.yml whitelists /actuator/prometheus, so a secured
        # endpoint is correct here -- but a 404 is not, and that is exactly the
        # silent failure mode: prometheus dropped from
        # management.endpoints.web.exposure.include kills the alarm line in every
        # environment while every other check stays green.
        python3 ops/health_smoke.py http://localhost:8080 --require-metrics --allow-metrics-secured
        python3 load_tests/runner.py --mode rate-limit
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload load-smoke app log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: load-smoke-app-log
        path: app-load-smoke.log
        if-no-files-found: warn

    - name: Check deployment smoke-check contracts
      run: python3 -m unittest ops.test_health_smoke -v

    - name: Check browser API contracts and idempotency behavior
      run: |
        node --check app/src/main/resources/static/i18n.js
        node --check app/src/main/resources/static/idempotency.js
        node --check app/src/main/resources/static/accounts.js
        node --check app/src/main/resources/static/transfers.js
        node --check app/src/main/resources/static/app.js
        # node:test runner (TAP + non-zero exit on failure); new *.test.js
        # files under app/src/test/js/ are picked up without editing CI.
        # Quoted glob (not a bare directory): node expands it internally on
        # every OS; a bare dir path is treated as a module and fails.
        node --test "app/src/test/js/*.test.js"

    - name: Frontend XSS guard (H-2)
      run: |
        python3 scripts/check_frontend_xss.py
        python3 scripts/check_frontend_xss.py --self-test

    - name: Frontend lint (ESLint, M-1 slice)
      run: |
        npm ci
        npm run lint

    - name: Frontend audit (npm audit, high+, advisory)
      # Advisory on purpose: the shipped UI is dependency-free vanilla JS —
      # npm covers a single devDependency (eslint), so a blocking gate would
      # let dev-tool noise veto prod builds. Findings are reported for triage;
      # blocking supply-chain gates stay in dependency-review + OSV review.
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Architecture Tests
      # Wildcard (not an explicit class list): a new *ArchitectureTest must
      # run in CI without editing this file. Verified pattern covers all
      # architecture rules including future additions.
      run: mvn test -pl app -am -Dtest="*ArchitectureTest,PersistenceScanPackagesTest" -Dsurefire.failIfNoSpecifiedTests=false -q

    - name: Dependency Analysis (advisory — starter aggregation causes false positives)
      run: mvn dependency:analyze -q
      continue-on-error: true

    - name: Cache PIT History
      uses: actions/cache@v5
      with:
        path: '**/target/pit-history.txt'
        key: ${{ runner.os }}-pit-${{ hashFiles('**/*.java') }}
        restore-keys: ${{ runner.os }}-pit-

    - name: Mutation Tests (PIT)
      run: mvn pitest:mutationCoverage -Dpitest.skip=false -T 4 -q
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload JaCoCo Coverage Report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jacoco-reports
        path: |
          **/target/site/jacoco/
          **/target/site/jacoco-aggregate/

    - name: Upload PIT Mutation Report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pit-reports
        path: '**/target/pit-reports/'

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-results
        path: '**/target/surefire-reports/'

    - name: Upload Failsafe Integration Test Results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: failsafe-reports
        path: '**/target/failsafe-reports/'
