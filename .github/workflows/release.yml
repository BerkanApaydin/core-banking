name: Release (digest-pinned image)

on:
  # Automatic releases are disabled: pushing a tag no longer builds, pushes
  # or publishes anything. To cut a release, run this workflow manually from
  # the Actions tab ("Run workflow") and provide the tag to publish.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, push and pin (e.g. v0.0.2)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/bank-app
        tags: |
          type=raw,value=${{ inputs.tag }}

    - name: Build and push
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}

    - name: Pin manifest to digest
      env:
        PINNED: ghcr.io/${{ github.repository_owner }}/bank-app@${{ steps.push.outputs.digest }}
        TAG: ${{ inputs.tag }}
      run: |
        awk -v img="$PINNED" '{ if ($0 ~ /^[[:space:]]*image:/) print "          image: " img; else print }' k8s/bank-app.yaml > k8s/bank-app.yaml.tmp && mv k8s/bank-app.yaml.tmp k8s/bank-app.yaml
        grep -q "@sha256:" k8s/bank-app.yaml
        { echo "$PINNED"; echo "pinned_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "git_sha=$(git rev-parse HEAD)"; echo "tag=$TAG"; } > k8s/.image-digest

    - name: Record digest in release notes
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        files: |
          k8s/bank-app.yaml
          k8s/.image-digest
        body: |
          Pinned image: `ghcr.io/${{ github.repository_owner }}/bank-app@${{ steps.push.outputs.digest }}`
          The attached `bank-app.yaml` is already pinned to that digest — apply it directly. See `docs/release.md`.
