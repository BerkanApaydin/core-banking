name: Release (digest-pinned image)

on:
  # Automatic releases are disabled: pushing a tag no longer builds, pushes
  # or publishes anything. To cut a release, run this workflow manually from
  # the Actions tab ("Run workflow") and provide the tag to publish.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, push and pin (e.g. v0.0.2)'
        required: true
      base_builder_image:
        description: 'Builder base image (digest-pin for reproducibility)'
        required: false
        default: 'maven:3.9-eclipse-temurin-21-alpine'
      base_runtime_image:
        description: 'Runtime base image (digest-pin for reproducibility)'
        required: false
        default: 'eclipse-temurin:21-jre-alpine'

permissions:
  contents: write
  packages: write

jobs:
  verify-green-ci:
    # O-2: the release ships whatever is checked out — never ship a red
    # commit. Manual dispatch does not imply green CI, so the workflow itself
    # refuses to publish unless the exact SHA has a successful ci.yml run.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0

    - name: Require green CI on this SHA
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SHA=$(git rev-parse HEAD)
        echo "Release candidate SHA: $SHA"
        MATCH=$(gh run list --workflow ci.yml --status success --limit 20 \
          --json headSha,conclusion --jq ".[] | select(.headSha==\"$SHA\") | .headSha" | head -1)
        if [ "$MATCH" != "$SHA" ]; then
          echo "::error::No successful ci.yml run for SHA $SHA — merge green CI first, then release."
          exit 1
        fi
        echo "Green CI confirmed for $SHA"

  build-push:
    needs: verify-green-ci
    # Attach the GitHub environment so owners can require manual approval
    # (configure reviewers under Settings > Environments > production).
    # Unconfigured environments record the deployment without blocking.
    environment: production
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Validate release tag points at this commit
      # Never publish a tag that is not SemVer-shaped or that points at a
      # different commit: the release notes and the pinned manifest must
      # describe the code CI just verified, not an arbitrary tag.
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
          echo "::error::Invalid release tag '$TAG' (expected vMAJOR.MINOR.PATCH[-prerelease])"
          exit 1
        fi
        SHA=$(git rev-parse HEAD)
        TAG_SHA=$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null || true)
        if [ -z "$TAG_SHA" ]; then
          echo "::error::Tag '$TAG' does not exist in this repository"
          exit 1
        fi
        if [ "$TAG_SHA" != "$SHA" ]; then
          echo "::error::Tag '$TAG' points at $TAG_SHA, but checked-out SHA is $SHA"
          exit 1
        fi
        echo "Tag '$TAG' verified: $TAG_SHA"

    - name: Resolve base images to immutable digests
      # Inputs may be tags for convenience, but the build must consume a
      # digest: an unpinned builder/runtime tag can change between releases
      # even when the application commit is identical.
      id: bases
      env:
        BUILDER_INPUT: ${{ inputs.base_builder_image }}
        RUNTIME_INPUT: ${{ inputs.base_runtime_image }}
      run: |
        resolve() {
          ref="$1"
          if printf '%s' "$ref" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
            printf '%s' "$ref"
            return 0
          fi
          docker pull "$ref" >/dev/null
          digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")
          if ! printf '%s' "$digest_ref" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not resolve $ref to a sha256 digest" >&2
            return 1
          fi
          printf '%s' "$digest_ref"
        }
        BUILDER=$(resolve "$BUILDER_INPUT")
        RUNTIME=$(resolve "$RUNTIME_INPUT")
        {
          echo "builder=$BUILDER"
          echo "runtime=$RUNTIME"
        } >> "$GITHUB_OUTPUT"
        echo "Builder: $BUILDER"
        echo "Runtime: $RUNTIME"

    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/bank-app
        tags: |
          type=raw,value=${{ inputs.tag }}

    - name: Build and push
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        provenance: true
        sbom: true
        build-args: |
          BASE_BUILDER_IMAGE=${{ steps.bases.outputs.builder }}
          BASE_RUNTIME_IMAGE=${{ steps.bases.outputs.runtime }}

    - name: Pin flyway image to digest
      # O-7/R-O05: the source manifest is already pinned to the Flyway version
      # declared in pom.xml plus a multi-arch index digest. Re-resolve that exact
      # version (never the rolling :11-alpine tag) and emit the index digest, so
      # amd64 and arm64 nodes pull the same release. A failed/blank inspect fails
      # closed instead of producing a floating manifest.
      run: |
        FLYWAY_VERSION=$(sed -n 's:.*<flyway.version>\(.*\)</flyway.version>.*:\1:p' pom.xml | head -1)
        if [ -z "$FLYWAY_VERSION" ]; then
          echo "::error::flyway.version missing from pom.xml"
          exit 1
        fi
        FLYWAY_REF="flyway/flyway:${FLYWAY_VERSION}-alpine"
        DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$FLYWAY_REF")
        if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
          echo "::error::could not resolve a multi-arch index digest for $FLYWAY_REF (got: '$DIGEST')"
          exit 1
        fi
        PINNED="${FLYWAY_REF}@${DIGEST}"
        echo "Flyway pinned: $PINNED"
        awk -v img="$PINNED" '{ if ($0 ~ /^[[:space:]]*image:[[:space:]]+flyway\/flyway/) print "          image: " img; else print }' k8s/flyway-migrate-job.yaml > k8s/flyway-migrate-job.yaml.tmp && mv k8s/flyway-migrate-job.yaml.tmp k8s/flyway-migrate-job.yaml
        grep -q "flyway/flyway:${FLYWAY_VERSION}-alpine@sha256:" k8s/flyway-migrate-job.yaml
        echo "$PINNED" > k8s/.flyway-digest

    - name: Pin manifest to digest
      env:
        PINNED: ghcr.io/${{ github.repository_owner }}/bank-app@${{ steps.push.outputs.digest }}
        TAG: ${{ inputs.tag }}
      run: |
        awk -v img="$PINNED" '{ if ($0 ~ /^[[:space:]]*image:/) print "          image: " img; else print }' k8s/bank-app.yaml > k8s/bank-app.yaml.tmp && mv k8s/bank-app.yaml.tmp k8s/bank-app.yaml
        grep -q "@sha256:" k8s/bank-app.yaml
        { echo "$PINNED"; echo "pinned_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "git_sha=$(git rev-parse HEAD)"; echo "tag=$TAG"; } > k8s/.image-digest

    - name: Record digest in release notes
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: ${{ inputs.tag }}
        files: |
          k8s/bank-app.yaml
          k8s/.image-digest
          k8s/flyway-migrate-job.yaml
          k8s/.flyway-digest
        body: |
          Pinned image: `ghcr.io/${{ github.repository_owner }}/bank-app@${{ steps.push.outputs.digest }}`
          The attached `bank-app.yaml` is already pinned to that digest — apply it directly. See `docs/release.md`.
