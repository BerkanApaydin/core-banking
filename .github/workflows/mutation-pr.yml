name: Mutation PR (targeted, advisory)

# I-07: fast mutation feedback on pull requests. The full-domain 85% gate
# stays in mutation-nightly (weekly, blocking-forward); this workflow runs
# PIT only for top-level modules with changed production sources so authors
# see surviving mutants on their own code within the PR. Advisory
# (no threshold): the nightly gate remains the single blocking number.
on:
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/src/main/java/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-targeted:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bank_db
          POSTGRES_USER: bank_user
          POSTGRES_PASSWORD: bank_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Resolve changed top-level modules
      id: modules
      run: |
        BASE="origin/${{ github.base_ref }}"
        CHANGED=$(git diff --name-only "$BASE"...HEAD -- '*/src/main/java/**' | cut -d/ -f1 | sort -u | paste -sd, -)
        if [ -z "$CHANGED" ]; then
          CHANGED="common"
        fi
        echo "modules=$CHANGED" >> "$GITHUB_OUTPUT"
        echo "Targeted modules: $CHANGED"

    - name: Install reactor JARs (skip tests)
      run: mvn -B -ntp clean install -DskipTests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: ${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5971' }}

    - name: Targeted mutation (advisory)
      run: mvn -B -ntp pitest:mutationCoverage -pl "${{ steps.modules.outputs.modules }}" -Dpitest.skip=false -T 4
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload targeted PIT report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pit-pr-targeted
        path: '**/target/pit-reports/'
        if-no-files-found: warn
