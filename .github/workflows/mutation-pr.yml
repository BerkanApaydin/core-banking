name: Mutation PR (targeted, advisory)

# I-07: fast mutation feedback on pull requests. The full-domain 85% gate
# lives in mutation-nightly, whose weekly schedule is disabled (2026-10-19)
# and therefore runs only on manual dispatch; this workflow runs PIT for
# top-level modules with changed production sources so authors see surviving
# mutants on their own code within the PR. Advisory (no threshold): the main
# ci.yml gate (80% mutation / 85% coverage) remains the blocking number.
on:
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/src/main/java/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-targeted:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bank_db
          POSTGRES_USER: bank_user
          POSTGRES_PASSWORD: bank_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Resolve changed top-level modules
      id: modules
      run: |
        BASE="origin/${{ github.base_ref }}"
        CHANGED=$(git diff --name-only "$BASE"...HEAD -- '*/src/main/java/**' | cut -d/ -f1 | sort -u | paste -sd, -)
        if [ -z "$CHANGED" ]; then
          CHANGED="common"
        fi
        echo "modules=$CHANGED" >> "$GITHUB_OUTPUT"
        echo "Targeted modules: $CHANGED"

    - name: Resolve CI JWT secret (HIGH-2, no committed fallback)
      run: |
        if [ -n "${{ secrets.JWT_SECRET }}" ]; then
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> "$GITHUB_ENV"
        else
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
        fi

    - name: Install reactor JARs (skip tests)
      run: mvn -B -ntp clean install -DskipTests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: ${{ env.JWT_SECRET }}

    - name: Targeted mutation (advisory)
      # Advisory means no thresholds: the root pom pins mutationThreshold=80 /
      # coverageThreshold=85, which would otherwise make this PR workflow fail
      # exactly like the blocking ci.yml gate. Zeroing both keeps the main
      # pipeline the single blocking number while PRs still get the report.
      run: mvn -B -ntp pitest:mutationCoverage -pl "${{ steps.modules.outputs.modules }}" -Dpitest.skip=false -DmutationThreshold=0 -DcoverageThreshold=0 -T 4
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: bank_user
        DB_PASSWORD: bank_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload targeted PIT report
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: pit-pr-targeted
        path: '**/target/pit-reports/'
        if-no-files-found: warn
