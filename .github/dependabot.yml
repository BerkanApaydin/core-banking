version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - org.springframework*
          - org.springframework.boot*
      testcontainers:
        patterns:
          - org.testcontainers*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
