jwt:
  allow-default-secret: false
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

spring:
  flyway:
    baseline-on-migrate: false
    validate-on-migrate: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        # REQUIRED for Kubernetes: without this flag Spring Boot does not
        # expose /actuator/health/liveness and /actuator/health/readiness,
        # so the k8s probes (liveness/readiness/startup) return 404 and pods
        # never become Ready. Enabled here (not only in k8s env) so every
        # prod deployment gets the probe groups.
        enabled: true
      group:
        readiness:
          include: readinessState,db,redisBackends
  # NOTE: no micrometer-tracing/OTel SDK on the classpath yet, so there is
  # intentionally no management.tracing block here. Correlation/trace IDs in
  # logs are generated locally by CorrelationIdFilter until real distributed
  # tracing is added (then reintroduce sampling config + OTLP endpoint).

app:
  cache:
    caffeine:
      account-info:
        backend: redis
  security:
    browser-session:
      secure: true
    rate-limit:
      backend: redis
    failed-login:
      backend: redis
    token-blacklist:
      backend: ${TOKEN_BLACKLIST_BACKEND:hybrid}
