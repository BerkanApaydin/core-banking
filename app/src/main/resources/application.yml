server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 500
    max-connections: 2000
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,application/javascript
    min-response-size: 1024

spring:
  lifecycle:
    # Aligns with server.shutdown=graceful: in-flight requests (incl. the
    # 30s use-case tx timeout) get room to finish before the context closes.
    timeout-per-shutdown-phase: 30s
  profiles:
    active: dev
  application:
    name: clean-architecture-bank
  messages:
    basename: messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bank_db
    username: ${DB_USERNAME:bank_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000
      leak-detection-threshold: 10000
      read-only: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  allow-default-secret: ${JWT_ALLOW_DEFAULT_SECRET:false}

app:
  proxy:
    # Honor X-Forwarded-For ONLY behind a trusted reverse proxy that overwrites
    # it (e.g. ingress). Default false: the header is attacker-controlled and
    # feeds IP rate limiting, brute-force lockout and public idempotency keys.
    trust-forwarded-headers: ${PROXY_TRUST_HEADERS:false}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
    failed-login:
      backend: ${FAILED_LOGIN_BACKEND:caffeine}
      max-attempts: ${FAILED_LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${FAILED_LOGIN_WINDOW_MINUTES:15}
    rate-limit:
      backend: ${RATE_LIMIT_BACKEND:caffeine}
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
      time-window-ms: ${RATE_LIMIT_TIME_WINDOW_MS:10000}
      paths:
        - /api/v1/auth/login
        - /api/v1/auth/register
        - /api/v1/accounts
        - /api/v1/transfers
    token-blacklist:
      backend: ${TOKEN_BLACKLIST_BACKEND:caffeine}
      min-ttl-ms: ${TOKEN_BLACKLIST_MIN_TTL_MS:1000}
      max-ttl-ms: ${TOKEN_BLACKLIST_MAX_TTL_MS:2592000000}
  idempotency:
    cleanup-cron: ${IDEMPOTENCY_CLEANUP_CRON:0 0 * * * *}
    expiration-hours: ${IDEMPOTENCY_EXPIRATION_HOURS:24}
  integrity:
    enabled: ${ORPHAN_CHECK_ENABLED:true}
    orphan-check-cron: ${ORPHAN_CHECK_CRON:0 0 3 * * *}
    orphan-alarm-threshold: ${ORPHAN_ALARM_THRESHOLD:0}
  transfer:
    cancellation-window-hours: ${TRANSFER_CANCELLATION_WINDOW_HOURS:24}
  transaction:
    timeout-seconds: ${TRANSACTION_TIMEOUT_SECONDS:30}
  outbox:
    enabled: ${OUTBOX_POLL_ENABLED:true}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:2000}
    max-retries: ${OUTBOX_MAX_RETRIES:5}
    partition-count: ${OUTBOX_PARTITION_COUNT:2}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
  cache:
    caffeine:
      account-info:
        backend: ${CACHE_ACCOUNT_INFO_BACKEND:caffeine}
        maximum-size: ${CACHE_ACCOUNT_INFO_MAX_SIZE:1000}
        expire-after-write: ${CACHE_ACCOUNT_INFO_EXPIRE_SEC:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized


