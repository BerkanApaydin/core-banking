server:
  shutdown: graceful
  tomcat:
    threads:
      # Capped relative to the Hikari pool (20): every request thread can hold
      # a DB connection for the whole use-case transaction, so threads >> pool
      # only queues on Hikari (5s connection-timeout -> 500). Keep
      # threads.max ~= 3x pool; non-DB work (static UI, health) shares the rest.
      # Raise DB_MAX_POOL_SIZE first if this limit throttles throughput.
      max: 64
      min-spare: 10
    # Fail fast under burst: a full queue rejects (caller retries / scales)
    # instead of parking thousands of sockets behind a saturated pool.
    accept-count: 100
    max-connections: 256
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,application/javascript
    min-response-size: 1024

spring:
  lifecycle:
    # Aligns with server.shutdown=graceful: in-flight requests (incl. the
    # 30s use-case tx timeout) get room to finish before the context closes.
    timeout-per-shutdown-phase: 30s
  # PERF-6: 11 @Scheduled jobs share one thread by default and block each
  # other (five */5 jobs fire the same second as the 60s backlog scan).
  task:
    scheduling:
      pool:
        size: 4
  profiles:
    default: prod
  application:
    name: clean-architecture-bank
  messages:
    basename: messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bank_db
    username: ${DB_USERNAME:bank_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # K3: 20, not 50 — pool x replicas must fit the database budget
      # (6 pods x 20 = 120; see docs/operations.md). Override per deployment
      # with DB_MAX_POOL_SIZE; measure pool-wait before raising.
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: 10
      # Aligned with fail-fast Tomcat queueing above: waiting longer than the
      # caller's patience only converts a capacity problem into a 500 spike.
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000
      leak-detection-threshold: 10000
      read-only: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    # Never auto-baseline in any environment: adopting a non-empty schema
    # without history must be a reviewed, explicit migration baseline, not a
    # silent startup side effect. Fresh databases migrate normally with false.
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # PERF-7: the Redis-backed rate limiter runs on EVERY request over one
      # shared multiplex connection; a slow command blocks all threads.
      # Bounded pool + timeouts fail fast instead of parking Tomcat threads.
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}

jwt:
  secret: ${JWT_SECRET}
  # Short-lived access tokens + rotating refresh tokens. JWT_EXPIRATION stays
  # honored as the access lifetime so existing deployments keep working.
  access-expiration: ${JWT_ACCESS_EXPIRATION:${JWT_EXPIRATION:900000}}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  allow-default-secret: ${JWT_ALLOW_DEFAULT_SECRET:false}

app:
  proxy:
    # Honor X-Forwarded-For ONLY behind a trusted reverse proxy that overwrites
    # it (e.g. ingress). Default false: the header is attacker-controlled and
    # feeds IP rate limiting, brute-force lockout and public idempotency keys.
    trust-forwarded-headers: ${PROXY_TRUST_HEADERS:false}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
    browser-session:
      # __Host- cookie prefix requires Secure; true only behind TLS (prod).
      # Dev serves plain HTTP, so this stays false outside prod.
      secure: ${BROWSER_SESSION_SECURE:false}
    failed-login:
      backend: ${FAILED_LOGIN_BACKEND:caffeine}
      max-attempts: ${FAILED_LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${FAILED_LOGIN_WINDOW_MINUTES:15}
    rate-limit:
      backend: ${RATE_LIMIT_BACKEND:caffeine}
      # Auth tier (/api/v1/auth/*): tight brute-force budget, unchanged.
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
      time-window-ms: ${RATE_LIMIT_TIME_WINDOW_MS:10000}
      # Resource tier (/api/v1/accounts, /api/v1/transfers, /api/v1/admin):
      # looser budget for authenticated dashboard-style reads, so a normal
      # page load plus navigation — or several users behind one NAT address —
      # does not 429 on the login budget.
      resource-max-requests: ${RATE_LIMIT_RESOURCE_MAX_REQUESTS:120}
      resource-time-window-ms: ${RATE_LIMIT_RESOURCE_TIME_WINDOW_MS:60000}
      paths:
        - /api/v1/auth/login
        - /api/v1/auth/browser/login
        - /api/v1/auth/register
        - /api/v1/auth/refresh
        - /api/v1/auth/browser/refresh
        - /api/v1/auth/logout
        - /api/v1/auth/browser/logout
        - /api/v1/auth/browser/session
        - /api/v1/accounts
        - /api/v1/transfers
        - /api/v1/admin
    token-blacklist:
      backend: ${TOKEN_BLACKLIST_BACKEND:caffeine}
      min-ttl-ms: ${TOKEN_BLACKLIST_MIN_TTL_MS:1000}
      max-ttl-ms: ${TOKEN_BLACKLIST_MAX_TTL_MS:2592000000}
  idempotency:
    # Cron single-source: this yml is authoritative. Code @Scheduled defaults
    # (e.g. OrphanIntegrityReporter, AuditRetentionScheduler) must stay in sync
    # but are only fallbacks for when the property is unresolved.
    cleanup-cron: ${IDEMPOTENCY_CLEANUP_CRON:0 0 * * * *}
    expiration-hours: ${IDEMPOTENCY_EXPIRATION_HOURS:24}
    # Retry policy for the generic @Idempotent guard (all annotated endpoints).
    # Separate from app.transfer.* (transfer's own use-case retry aspect).
    max-attempts: ${IDEMPOTENCY_MAX_ATTEMPTS:3}
    initial-delay-ms: ${IDEMPOTENCY_INITIAL_DELAY_MS:500}
    reaper:
      # Crash-window recovery for stale PENDING reservations
      # (IdempotencyPendingReaper): rows older than older-than are marked
      # FAILED so the same key can retry via tryResetFailed. Must stay well
      # above the 30s use-case tx timeout so slow (not dead) requests are
      # never reaped.
      enabled: ${IDEMPOTENCY_REAPER_ENABLED:true}
      cron: ${IDEMPOTENCY_REAPER_CRON:0 */5 * * * *}
      older-than: ${IDEMPOTENCY_REAPER_OLDER_THAN:PT15M}
  integrity:
    enabled: ${ORPHAN_CHECK_ENABLED:true}
    orphan-check-cron: ${ORPHAN_CHECK_CRON:0 0 3 * * *}
    orphan-alarm-threshold: ${ORPHAN_ALARM_THRESHOLD:0}
  audit:
    max-query-limit: ${AUDIT_MAX_QUERY_LIMIT:500}
    retention-enabled: ${AUDIT_RETENTION_ENABLED:true}
    retention-days: ${AUDIT_RETENTION_DAYS:365}
    retention-cron: ${AUDIT_RETENTION_CRON:0 0 4 * * 0}
  observability:
    backlog:
      enabled: ${BACKLOG_METRICS_ENABLED:true}
      scan-delay-ms: ${BACKLOG_METRICS_SCAN_DELAY_MS:60000}
  transfer:
    # S7/S8: binds to a Duration (hours for plain numbers); the env name is
    # unchanged so existing deployments keep working.
    cancellation-window: ${TRANSFER_CANCELLATION_WINDOW_HOURS:24}
    reaper:
      # Crash-window recovery for PENDING leftovers (TransferPendingReaper):
      # rows older than older-than are marked FAILED through the domain.
      # Must stay well above the 30s use-case tx timeout so slow (not dead)
      # placements are never reaped.
      enabled: ${TRANSFER_REAPER_ENABLED:true}
      cron: ${TRANSFER_REAPER_CRON:0 */5 * * * *}
      older-than: ${TRANSFER_REAPER_OLDER_THAN:PT15M}
      batch-size: ${TRANSFER_REAPER_BATCH_SIZE:50}
  notification:
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    sms-enabled: ${NOTIFICATION_SMS_ENABLED:true}
  transaction:
    timeout-seconds: ${TRANSACTION_TIMEOUT_SECONDS:30}
  outbox:
    enabled: ${OUTBOX_POLL_ENABLED:true}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:2000}
    max-retries: ${OUTBOX_MAX_RETRIES:5}
    # PERF-8: workers are 4x partitions capped at 12 (see OutboxPoller), so the
    # default 2 partitions hold max 8 REQUIRES_NEW transactions — well under
    # the Hikari pool of 20. Raising partition-count raises workers too:
    # keep partitions x 4 <= 12 or raise DB_MAX_POOL_SIZE first.
    partition-count: ${OUTBOX_PARTITION_COUNT:2}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    # Retention window for processed outbox rows and their handler dedup keys
    # (unprocessed and dead-letter rows are never deleted).
    retention-days: ${OUTBOX_RETENTION_DAYS:30}
  cache:
    caffeine:
      account-info:
        backend: ${CACHE_ACCOUNT_INFO_BACKEND:caffeine}
        maximum-size: ${CACHE_ACCOUNT_INFO_MAX_SIZE:1000}
        expire-after-write: ${CACHE_ACCOUNT_INFO_EXPIRE_SEC:60}
        # SCAN batch for operational evict-all resets (Redis backend).
        eviction-batch-size: ${CACHE_ACCOUNT_INFO_EVICTION_BATCH_SIZE:500}

management:
  endpoints:
    web:
      exposure:
        # info stays hidden (not whitelisted, unreachable anyway per K1/D1).
        # loggers is exposed for restart-free level changes in prod but is NOT
        # whitelisted: SecurityConfig restricts /actuator/loggers/** to ADMIN.
        include: health,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized


