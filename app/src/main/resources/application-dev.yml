spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bank_db?options=-c%20TimeZone%3DUTC
    username: ${DB_USERNAME:bank_user}
    password: ${DB_PASSWORD:bank_password}
    hikari:
      read-only: false

app:
  demo:
    seed:
      ahmet-password: ${DEMO_SEED_AHMET_PASSWORD:Ahmet12345678}
      ayse-password: ${DEMO_SEED_AYSE_PASSWORD:Ayse12345678}

jwt:
  # Dev-only insecure fallback: never use in prod. Prod has no default and
  # fails fast when JWT_SECRET is unset (see application.yml / prod yml).
  # This is NOT a secret: it is a zero-entropy Base64 marker that decodes to
  # 'dev-only-NOT-FOR-PROD-0000000000' (32 bytes). It is kept byte-for-byte
  # equal to JwtTokenProvider.DEFAULT_JWT_SECRET and docker-compose.yml by
  # scripts/check_compose_jwt_default.py; .gitleaks.toml allowlists it. Prod
  # refuses exactly this value twice, so it can never be used as a real key.
  secret: ${JWT_SECRET:ZGV2LW9ubHktTk9ULUZPUi1QUk9ELTAwMDAwMDAwMDA=}
  allow-default-secret: true
