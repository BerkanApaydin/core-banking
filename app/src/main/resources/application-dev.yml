spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bank_db
    username: ${DB_USERNAME:bank_user}
    password: ${DB_PASSWORD:bank_password}
    hikari:
      read-only: false

jwt:
  # Dev-only insecure fallback: never use in prod. Prod has no default and
  # fails fast when JWT_SECRET is unset (see application.yml / prod yml).
  # If this fallback value ever leaks, rotate it.
  secret: ${JWT_SECRET:dev-only-insecure-fallback-not-for-prod}
  allow-default-secret: true
