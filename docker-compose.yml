services:
  postgres:
    image: postgres:15-alpine
    container_name: bank-postgres
    # K22: local query observability (dev only — production observability
    # belongs in the managed DB's parameter group, not in a compose file).
    # pg_stat_statements enables per-query stats; log_min_duration_statement
    # surfaces slow queries in `docker compose logs postgres`.
    command:
      - postgres
      - -cshared_preload_libraries=pg_stat_statements
      - -cpg_stat_statements.track=all
      - -clog_min_duration_statement=200
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
      POSTGRES_DB: bank_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bank-redis
    ports:
      - "127.0.0.1:6389:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Local-dev defaults below. PROD: set SPRING_PROFILES_ACTIVE=prod and provide
      # JWT_SECRET + DB_PASSWORD from a secret manager. Never deploy prod with the
      # default dev secret (ApplicationStartupValidator fails fast on prod+default).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-bank_user}
      DB_PASSWORD: ${DB_PASSWORD:-bank_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Zero-setup local boot: `docker compose up` works with no env vars and
      # no command-line secrets. The default below is JwtTokenProvider's
      # DEFAULT_JWT_SECRET on purpose: dev boots with it (WARN logged), while
      # prod refuses exactly this value twice — JwtTokenProvider
      # (allow-default-secret=false is a prod-yml literal) plus
      # ApplicationStartupValidator both fail fast on it. Keep it equal to the
      # code constant (checked by scripts/check_compose_jwt_default.py); never
      # use it outside local experimentation. Anything real needs an explicit
      # generated secret: export JWT_SECRET="$(openssl rand -base64 32)".
      # Exposure is loopback-only (all `ports:` below bind 127.0.0.1), so the
      # publicly-known dev default is unreachable from the network.
      # NOTE: JWT_ALLOW_DEFAULT_SECRET is intentionally NOT passed through
      # here. The dev profile enables it via application-dev.yml; wiring it
      # through compose would let a copied line re-enable the default secret
      # in a prod-shaped deployment.
      JWT_SECRET: "${JWT_SECRET:-i83oGVJffFn/qzcqrahuJ6oxZyKp6bvxmDukRE/X3+s=}"
      FAILED_LOGIN_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      RATE_LIMIT_RESOURCE_MAX_REQUESTS: ${RATE_LIMIT_RESOURCE_MAX_REQUESTS:-120}
      RATE_LIMIT_RESOURCE_TIME_WINDOW_MS: ${RATE_LIMIT_RESOURCE_TIME_WINDOW_MS:-60000}
      TOKEN_BLACKLIST_BACKEND: ${TOKEN_BLACKLIST_BACKEND:-hybrid}
      CACHE_ACCOUNT_INFO_BACKEND: redis
      # Local tracing: the collector below receives OTLP/HTTP spans. Prod
      # keeps TRACING_ENABLED=false until a collector is deployed (D22).
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: bank-otel-collector
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

volumes:
  postgres_data:
