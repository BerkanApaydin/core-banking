# I-03: working-tree secret scan. Auto-discovered by `gitleaks detect`
# (repo root). HIGH-2: no workflow or compose file may embed a real secret
# literal — CI mints an ephemeral key per run, compose requires JWT_SECRET.
# The single allowlist entry below is a documented non-secret placeholder
# (anchored so it cannot match inside a longer real secret).
title = "bank-app secret scan"

[extend]
useDefault = true

[allowlist]
description = "documented non-secret placeholder only; never a real key"
regexes = [
  '''^dev-only-insecure-fallback-not-for-prod$''',
]
