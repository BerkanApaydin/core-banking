# docker-compose.prod.yml — production-shaped local validation (NOT for real prod data).
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# Requires Docker Compose >= 2.24.4 for the !override / !reset merge tags.
#
# Differences from the dev file (deliberate):
#  - SPRING_PROFILES_ACTIVE is pinned to prod (no dev fallback, no insecure secret).
#  - JWT_SECRET and DB_PASSWORD are REQUIRED: the ${VAR:?message} form fails
#    fast with a readable error instead of booting a publicly-known key.
#  - MFA_ENCRYPTION_KEY is REQUIRED too: prod boots with fail-fast validation
#    and TOTP secrets cannot encrypt without it (generate: openssl rand -base64 32).
#  - No published database ports: the DB is reachable only inside the compose
#    network (no localhost exposure). The app keeps :8080 for smoke checks.
#  - Token-blacklist / rate-limit / cache backends are Redis (prod contract,
#    enforced again at boot by ApplicationStartupValidator).
#  - No otel-collector: prod keeps TRACING_ENABLED=false until a real
#    collector endpoint is configured (D22).
# Real production additionally uses a managed database, a secret manager and
# explicit CORS origins (see docs/operations.md + .env.example).

services:
  postgres:
    ports: []
    environment:
      POSTGRES_USER: ${DB_USERNAME:?prod requires DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?prod requires DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bank_db}

  redis:
    # No published ports (DB/cache reachable only inside the compose network).
    # No requirepass here: real production uses managed Redis with AUTH. The
    # app honors spring.data.redis.password via Boot relaxed binding (see
    # RedisRateLimitConfig + RedisRateLimitConfigTest), so point
    # SPRING_DATA_REDIS_PASSWORD at the broker secret when AUTH is enforced —
    # e.g. uncomment the line below. Kept commented (not empty): an empty
    # password would make Lettuce send AUTH against a no-AUTH broker and fail.
    # this file validates the boot contract, not the network perimeter
    # (see k8s/networkpolicy.yaml for the latter).
    ports: []

  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Keep actuator off the published 8080 port; 8081 is not published.
      MANAGEMENT_SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?prod requires DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?prod requires DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Managed-Redis AUTH (S-3): uncomment when the broker enforces AUTH.
      # SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?redis AUTH password}
      # Generate with: openssl rand -base64 32 (must decode to >= 32 bytes).
      JWT_SECRET: ${JWT_SECRET:?prod requires JWT_SECRET}
      JWT_ALLOW_DEFAULT_SECRET: "false"
      # TOTP-secret encryption at rest (AES-256, Base64, 32 bytes). Same
      # fail-fast contract as JWT_SECRET above; see
      # docs/decisions/secret-management.md (rotation invalidates enrollments).
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?prod requires MFA_ENCRYPTION_KEY}
      FAILED_LOGIN_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      TOKEN_BLACKLIST_BACKEND: hybrid
      CACHE_ACCOUNT_INFO_BACKEND: redis
      TRACING_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?prod requires CORS_ALLOWED_ORIGINS (no localhost)}
    # The collector is removed from the merged stack below, so the app must
    # not depend on it either (a dangling depends_on is an invalid project).
    # `!override` REPLACES the mapping instead of merging it, so the dev
    # file's otel-collector entry cannot survive. The health-gated
    # postgres/redis dependencies are restated here.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The dev file defines an otel-collector for local tracing. Prod keeps
  # TRACING_ENABLED=false until a real collector endpoint is configured
  # (D22), so the service is removed from the merged stack here — the
  # overlay previously only mentioned it in a comment, and the merged
  # `docker compose config --services` still listed it. The reset value is
  # `{}` (not `null`) so the editor's compose-spec schema still sees a valid
  # service mapping; Compose ignores the value and removes the service.
  otel-collector: !reset {}

