# docker-compose.prod.yml — production-shaped local validation (NOT for real prod data).
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Differences from the dev file (deliberate):
#  - SPRING_PROFILES_ACTIVE is pinned to prod (no dev fallback, no insecure secret).
#  - JWT_SECRET and DB_PASSWORD are REQUIRED: the ${VAR:?message} form fails
#    fast with a readable error instead of booting a publicly-known key.
#  - No published database ports: the DB is reachable only inside the compose
#    network (no localhost exposure). The app keeps :8080 for smoke checks.
#  - Token-blacklist / rate-limit / cache backends are Redis (prod contract,
#    enforced again at boot by ApplicationStartupValidator).
#  - No otel-collector: prod keeps TRACING_ENABLED=false until a real
#    collector endpoint is configured (D22).
# Real production additionally uses a managed database, a secret manager and
# explicit CORS origins (see docs/operations.md + .env.example).

services:
  postgres:
    ports: []
    environment:
      POSTGRES_USER: ${DB_USERNAME:?prod requires DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?prod requires DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bank_db}

  redis:
    # No published ports (DB/cache reachable only inside the compose network).
    # No requirepass here: real production uses managed Redis with AUTH (then
    # set spring.data.redis.password); this file validates the boot contract,
    # not the network perimeter (see k8s/networkpolicy.yaml for the latter).
    ports: []

  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?prod requires DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?prod requires DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Generate with: openssl rand -base64 32 (must decode to >= 32 bytes).
      JWT_SECRET: ${JWT_SECRET:?prod requires JWT_SECRET}
      JWT_ALLOW_DEFAULT_SECRET: "false"
      FAILED_LOGIN_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      TOKEN_BLACKLIST_BACKEND: hybrid
      CACHE_ACCOUNT_INFO_BACKEND: redis
      TRACING_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?prod requires CORS_ALLOWED_ORIGINS (no localhost)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
