apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-app
  labels:
    app: bank-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bank-app
  template:
    metadata:
      labels:
        app: bank-app
    spec:
      # Allow readiness removal and the configured 30s graceful shutdown to finish.
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: bank-app
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bank-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bank-app
          # Release pin: replaced with registry@sha256:digest by
          # scripts/pin-image-digest.sh (or the release workflow).
          # The default below is the versioned tag — never :latest, so an
          # unpinned apply cannot silently roll to a mutable tag (K9/D7).
          # CI fails if `bank-app:latest` reappears (see ci.yml guard).
          image: bank-app:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bank-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bank-db-secret
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bank-jwt-secret
                  key: secret
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            # Managed-Redis AUTH (S-3): mounted only when bank-redis-secret
            # exists; optional so AUTH-less clusters keep booting with the
            # property unset (never an empty string — an empty password would
            # make Lettuce send AUTH against a no-AUTH broker and fail).
            # The manual Lettuce factory reads spring.data.redis.password via
            # Boot relaxed binding (see RedisRateLimitConfiguration).
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bank-redis-secret
                  key: password
                  optional: true
            # K1: per-client IP buckets behind ingress. The app defaults to
            # distrusting X-Forwarded-For (TCP peer only), which collapses all
            # external clients into the ingress IP bucket — one abusive client
            # 429s everyone, and brute-force lockout loses precision. "true" is
            # correct ONLY in this single-ingress topology: ingress-nginx
            # appends the downstream peer as the LAST XFF entry (default
            # $proxy_add_x_forwarded_for) and ClientIpResolver trusts the last
            # entry only (leading entries stay spoofable). Never enable with a
            # CDN or multi-hop chain in front without revisiting (see ingress.yaml).
            - name: PROXY_TRUST_HEADERS
              value: "true"
            # K3: connection budget. 6 (HPA max) x 20 (pool) = 120 backend
            # connections, plus surge replica + migrations + operators. Keep
            # replicas x pool <= max_connections - headroom (stock PG15 default
            # is 100: use a managed instance with >= 200 or PgBouncer — see
            # docs/operations.md "Database connection capacity").
            - name: DB_MAX_POOL_SIZE
              value: "20"
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC -Djava.security.egd=file:/dev/./urandom"
          volumeMounts:
            # With readOnlyRootFilesystem=true the embedded Tomcat/JVM cannot write
            # to its temp directory -> CrashLoop. Keep only /tmp writable.
            - name: tmp-volume
              mountPath: /tmp
          # O-3: zero-downtime RollingUpdate. maxSurge:1/maxUnavailable:0 (above)
          # + PDB minAvailable:1 keep capacity during rolls; preStop drains the
          # endpoint before SIGTERM so in-flight requests finish inside the 30s
          # graceful-shutdown window (server.shutdown=graceful).
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bank-app
  labels:
    app: bank-app
spec:
  type: ClusterIP
  selector:
    app: bank-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-app
  minReplicas: 2
  maxReplicas: 6
  # M-3 roadmap (not yet wired): CPU/memory scale the stateless web tier, but
  # the financial bottlenecks are queue-shaped. The signals already exist in
  # Prometheus (no code change needed): outbox_pending_current +
  # outbox_oldest_pending_age_seconds (BacklogMetricsReporter),
  # hikaricp_connections_pending (Hikari), tomcat_threads_busy (Micrometer).
  # Wiring them needs prometheus-adapter (Custom Metrics API) installed in the
  # cluster first — adding `type: Pods`/`Object` entries without it turns every
  # HPA evaluation Unknown and freezes scaling, which is worse than CPU-only.
  # M-3 ready-to-wire template (uncomment ONLY after the adapter serves the
  # custom metrics API; verify with `kubectl get --raw
  # /apis/custom.metrics.k8s.io/v1beta1` first, then calibrate thresholds from
  # staging baselines — the values below are placeholders, not tuned):
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: outbox_pending_current
  #       target:
  #         type: AverageValue
  #         averageValue: 200
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: outbox_oldest_pending_age_seconds
  #       target:
  #         type: AverageValue
  #         averageValue: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bank-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bank-app
