# Default-deny with explicit allows. The application only needs:
# ingress from the ingress controller on 8080, egress to PostgreSQL (5432),
# Redis (6379) and the cluster DNS. Everything else (including pod-to-pod)
# is denied. Adjust namespace selectors to the actual topology.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-app-default-deny
  labels:
    app: bank-app
spec:
  podSelector:
    matchLabels:
      app: bank-app
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-app-allow
  labels:
    app: bank-app
spec:
  podSelector:
    matchLabels:
      app: bank-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller -> public application port only. Actuator is on the
    # private management port below and is intentionally unreachable here.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus scraper -> private management port only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Cluster DNS. TCP 53 is required for truncated UDP answers (large
    # responses / DNSSEC) and is also used by some DNS implementations.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL. In-cluster compose/dev topology.
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis (in-cluster compose/dev topology).
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Managed PostgreSQL/Redis: add the provider CIDR(s) here, for example:
    #   - to:
    #       - ipBlock:
    #           cidr: 10.0.0.0/8
    #     ports:
    #       - { protocol: TCP, port: 5432 }
    #       - { protocol: TCP, port: 6379 }
    # Without this, a managed database/cache outside the cluster is blocked.
    # OTLP collector in the application namespace (k8s/otel-collector.yaml).
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4318
    # External OTLP collector in the monitoring namespace (optional).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318
