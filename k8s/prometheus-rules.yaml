# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
# Prometheus alerting rules for the instrumented signals. Thresholds below
# are starting points — derive production values from staging baselines
  # (see docs/operations.md) before paging anyone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bank-app
  labels:
    app: bank-app
spec:
  groups:
    - name: connection-pool
      interval: 30s
      rules:
        - alert: DatabaseConnectionPoolSaturation
          # Pool starvation is the failure mode behind the 500-spike cliff:
          # a use-case transaction holds its connection for up to
          # app.transaction.timeout-seconds (30s) while it waits on a
          # pessimistic row lock. Once the pool is exhausted, every further
          # request queues on it. `hikaricp_connections_pending` is the
          # number of threads WAITING for a connection — the leading
          # indicator, available before any request has actually failed.
          expr: max(hikaricp_connections_pending) > 5
          for: 2m
          labels:
            severity: ticket
          annotations:
            summary: "Threads are waiting for a database connection — the pool is exhausted"
            runbook_url: "docs/operations.md"
        - alert: DatabaseConnectionAcquireSlow
          # Time spent acquiring a connection. A high value with a LOW
          # pending count means the pool itself is too small for the
          # transaction budget; a high value with a high pending count
          # points at slow or locked queries instead.
          expr: max(hikaricp_connections_acquire_seconds_max) > 5
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: "Acquiring a database connection takes more than 5s"
            runbook_url: "docs/operations.md"
    - name: outbox
      interval: 60s
      rules:
        - alert: OutboxDeadLetter
          # The dead_letter counter carries no `type` label, so no `by (...)`
          # grouping: grouping by a missing label is misleading in dashboards.
          expr: sum(increase(outbox_event_dead_letter_total[1h])) > 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Outbox events exhausted retries and moved to dead letter"
            runbook_url: "docs/outbox-operations.md"
        - alert: OutboxFailuresRising
          expr: sum(rate(outbox_event_failed_total[5m])) > 0.1
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Outbox event failures retrying above 0.1/sec"
        - alert: OutboxOldestPendingGrowing
          # Leader-elected scan like the orphan/backlog gauges: max() keeps a
          # follower's frozen gauge from paging.
          expr: max(outbox_oldest_pending_age_seconds) > 600
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Oldest pending outbox event is older than 10 minutes"
        - alert: OutboxPollFailures
          expr: sum(rate(outbox_poll_partition_error_total[5m])) by (partition) > 0
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Outbox poll cycles aborting — selection, locking or dispatch failing"
            runbook_url: "docs/outbox-operations.md"
    - name: integrity
      interval: 60s
      rules:
        - alert: LedgerImbalance
          # Money invariant: legs sharing a transaction_ref must net to zero.
          # Any nonzero group is a page — it means a partial write escaped the
          # single-transaction ledger discipline (see docs/slo.md).
          # Cadence note (PERF-1): the gauge is published by the 6-hourly
          # LedgerReconciliationJob, not a minutely scan — detection latency
          # is up to ~6h, but once flipped the gauge persists and pages here.
          expr: max(ledger_nonzero_transaction_refs) > 0
          for: 15m
          labels:
            severity: page
          annotations:
            summary: "Ledger legs do not net to zero — investigate unbalanced transaction_refs"
            runbook_url: "docs/slo.md"
        - alert: LedgerReconciliationStale
          # A balanced gauge is only meaningful if the scan still runs. The
          # last-success gauge stays at zero until the first successful scan
          # and stops moving when the job is disabled, crashloops, or loses
          # its advisory lock. 8h = one missed 6-hourly run + buffer.
          expr: time() - max(ledger_reconciliation_last_success_epoch_seconds) > 28800
          for: 1h
          labels:
            severity: ticket
          annotations:
            summary: "Ledger reconciliation has not completed in 8h — imbalance detection is blind"
            runbook_url: "docs/slo.md"
        - alert: DatabaseOrphanAlarm
          # The counter carries NO `type` label (only the db_orphan_current
          # gauge does), so `by (type)` grouped an empty label set and told
          # the operator nothing. Same mistake the outbox dead-letter rule
          # already documents for its own counter: drop the grouping.
          expr: sum(increase(db_orphan_alarm_total[1h])) > 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Orphan rows above threshold — constraint enforcement or restore integrity needs review"
        - alert: OrphanScanStale
          # K12/D5: scans are leader-elected, so only the leader's gauge moves.
          # max() across instances keeps followers' frozen gauges from paging.
          expr: time() - max(db_orphan_last_success_epoch_seconds) > 7200
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Orphan integrity scan has not completed in 2h"
    - name: audit
      interval: 60s
      rules:
        - alert: AuditPersistFailures
          expr: sum(increase(audit_persist_failures_total[1h])) by (action) > 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Audit persistence failed — money movements may lack their audit trail"
        # Best-effort auth audit fell back to the durable retry outbox.
        # The row is not lost, but the audit store is degraded; investigate
        # before the outbox relay dead-letters the event.
        - alert: AuditRetryEnqueued
          expr: sum(increase(audit_retry_enqueued_total[1h])) by (action) > 0
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: "Auth audit fell back to the durable retry outbox"
            runbook_url: "docs/decisions/audit-atomicity.md"
        # The retry enqueue itself failed: the audit row for this action is
        # lost.
        - alert: AuditRetryEnqueueFailed
          expr: sum(increase(audit_retry_failed_total[1h])) by (action) > 0
          for: 1m
          labels:
            severity: page
          annotations:
            summary: "Auth audit retry enqueue failed — audit row is lost"
            runbook_url: "docs/decisions/audit-atomicity.md"
        # The best-effort executor queue rejected the after-completion task.
        # There is no synchronous fallback (it would reintroduce pool
        # amplification), so the audit row for this action is lost.
        - alert: AuditBestEffortRejected
          expr: sum(increase(audit_best_effort_rejected_total[1h])) by (action) > 0
          for: 1m
          labels:
            severity: page
          annotations:
            summary: "Auth audit executor queue rejected event — audit row is lost"
            runbook_url: "docs/decisions/audit-atomicity.md"
        # Liveness of the audit dispatch seam (K2 rewire): consumed must track
        # persisted rows. A flat consumed counter while transfers succeed means
        # the AFTER_COMMIT observation path is broken again.
        - alert: AuditDispatchStalled
          expr: |
            sum(increase(audit_event_consumed_total[15m])) == 0
            and
            sum(increase(http_server_requests_seconds_count{uri="/api/v1/transfers",status="201"}[15m])) > 0
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Audit events are persisted but never observed after commit"
        - alert: AuditChainBroken
          # V67 tamper evidence: the nightly verifier recomputes the hash chain
          # and flips this gauge to 1 when a row was rewritten, deleted from the
          # middle, or removed from the head. A single nonzero value is a page:
          # the audit trail is legal evidence (docs/decisions/audit-integrity.md).
          expr: max(audit_chain_broken) > 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Audit hash chain is broken — do not delete evidence; snapshot the database and investigate"
            runbook_url: "docs/decisions/audit-integrity.md"
        - alert: AuditChainVerificationStale
          # The daily 03:30 verifier stops updating this gauge if the job is
          # disabled, crashloops, or the pod stops being scheduled. The chain
          # can be silently unverified without this rule.
          expr: time() - max(audit_chain_last_verified_epoch_seconds) > 172800
          for: 1h
          labels:
            severity: ticket
          annotations:
            summary: "Audit chain has not been verified in 48h"
            runbook_url: "docs/decisions/audit-integrity.md"
        - alert: AuditAnchorMismatch
          # F1 external anchor: the database head is behind a signed anchor,
          # an anchored retained row was rewritten, or the anchor signature is
          # invalid. A single event is a page: the database no longer proves
          # continuity with evidence an external party already saw.
          expr: sum(increase(audit_anchor_mismatches_total[1h])) > 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Audit anchor mismatch — freeze the database and preserve the anchor file"
            runbook_url: "docs/decisions/audit-integrity.md"
        - alert: AuditAnchorPublishFailures
          # Disk/object-lock write failures or a missing audit_chain_state row
          # leave the external anchor behind the database. The chain can still
          # be verifiable internally, but external continuity is not refreshed.
          expr: sum(increase(audit_anchor_failures_total[1h])) > 0
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: "Audit anchor publication is failing"
            runbook_url: "docs/decisions/audit-integrity.md"
        - alert: AuditAnchorStale
          # Enabled-but-not-running guard: default schedule is 03:45 daily, so
          # 30h tolerates one missed run plus verification margin. max() ignores
          # follower replicas whose gauge never moves because of leader election.
          expr: time() - max(audit_anchor_last_success_epoch_seconds) > 108000
          for: 1h
          labels:
            severity: ticket
          annotations:
            summary: "Audit anchor has not been published or checked in 30h"
            runbook_url: "docs/decisions/audit-integrity.md"
        - alert: AuditDefaultPartitionNonEmpty
          # Partition-drift guard (partitioning.md step 5): rows in the DEFAULT
          # partition fell outside every pre-created range because
          # ensure_audit_partition.sql was missed. Pre-cutover the gauge reads
          # 0 (table absent), so this is quiet until partitioning lands.
          expr: max(audit_default_partition_rows) > 0
          for: 30m
          labels:
            severity: ticket
          annotations:
            summary: "Audit rows landing in DEFAULT partition — run ensure_audit_partition.sql"
            runbook_url: "docs/decisions/partitioning.md"
    - name: idempotency-backlog
      interval: 60s
      rules:
        - alert: IdempotencyHttpBacklogStale
          # K12/D5: leader-elected scan — max() across instances, same as orphan scan.
          expr: time() - max(backlog_last_success_epoch_seconds) > 7200
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Backlog metrics scan has not completed in 2h"
        - alert: IdempotencyHttpBacklogGrowing
          # I-06: size complement to the staleness alert above. A stuck
          # reaper/cleanup leaves PENDING HTTP keys piling up; money is not
          # lost (TTL + reaper) but clients spin on replayed keys.
          # Gauge: BacklogMetricsReporter "idempotency.http.pending.current".
          expr: max(idempotency_http_pending_current) > 500
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Pending HTTP idempotency keys above 500 — check reaper/cleanup"
            runbook_url: "docs/operations.md"
        - alert: IdempotencyHttpOldestPendingGrowing
          # Mirror of OutboxOldestPendingGrowing for the HTTP-key seam: the
          # oldest-pending gauge exists but had no alert, so a wedged key
          # (client never completes the second leg) was invisible.
          expr: max(idempotency_http_oldest_pending_age_seconds) > 1800
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Oldest pending HTTP idempotency key is older than 30 minutes"
    - name: http-edge
      interval: 60s
      rules:
        - alert: Http429RateHigh
          # I-06: sustained 429s mean either abuse (tighten budgets / block)
          # or legitimate traffic outgrowing the tier (raise
          # app.security.rate-limit budgets). Standard Spring metric only.
          expr: sum(rate(http_server_requests_seconds_count{status="429"}[5m])) > 2
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "HTTP 429 rate above 2/sec — abuse or under-provisioned rate limits"
            runbook_url: "docs/operations.md"
    - name: database
      interval: 60s
      rules:
        - alert: HikariPoolExhaustion
          # K3 connection budget: 6 pods x 20 pool = 120 backend connections.
          # Threads waiting for a connection mean the pool (or the database)
          # is saturated — check for FOR UPDATE pile-ups and oversized
          # transactions before raising DB_MAX_POOL_SIZE (raising the pool
          # without raising max_connections just moves the queue to Postgres).
          expr: sum(hikaricp_connections_pending) by (pool) > 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Threads waiting for Hikari connections — pool or DB saturated"
            runbook_url: "docs/operations.md"
        - alert: HikariPoolSaturationHigh
          expr: |
            sum(hikaricp_connections_active) by (pool)
            /
            sum(hikaricp_connections_max) by (pool) > 0.85
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Hikari pool over 85% active for 15m — review capacity model"
    - name: concurrency
      interval: 60s
      rules:
        - alert: OptimisticLockConflictsRising
          # Version conflicts surface as HTTP 409 and are retried by the
          # use-case aspect — a sustained rate means genuine contention
          # (hot accounts, oversized transactions), not transient races.
          expr: sum(rate(bank_optimistic_lock_conflicts_total[5m])) by (exception) > 0.5
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "Optimistic-lock conflicts above 0.5/sec — investigate hot accounts"

