apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bank-app
  labels:
    app: bank-app
spec:
  selector:
    matchLabels:
      app: bank-app
  endpoints:
    # Actuator is served on the private management port, not the public 8080.
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
